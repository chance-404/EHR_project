server {
    listen 80;
    server_name ehr.chance404.cc;

    # redirect all traffic to HTTPS
    if ($host = ehr.chance404.cc) {
        return 301 https://$host$request_uri;
    }
}

# Rate limiting / rule applied to source IP / zone name & size / rate
limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

server {
    listen 443 ssl; # managed by Certbot;
    server_name ehr.chance404.cc;

    # SSL certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ehr.chance404.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ehr.chance404.cc/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 

    # root dir for angular files
    root /var/www/html/ehr-app/dist/browser;
    index index.html index.csr.html;

    # frontend - angular routing
    location / {
        # Try finding the file; if not, redirect to index.html for Angular routing
        try_files $uri $uri/ /index.html;

    # Rate limiting
    limit_req zone=frontend_limit burst=20 nodelay;
    limit_req_status 429;
    }

    # backend proxy to spring boot
    location /api {
        # rewrite the URL: /api/patients -> /patients
        rewrite ^/api/(.*)$ /$1 break;

    # Rate limiting
    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;

    # pass to the back-end
        proxy_pass http://localhost:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }



}
