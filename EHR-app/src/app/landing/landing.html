<app-header></app-header>

<!-- Need to add user feedback messages / error handling -->

<form id= "loginForm" [formGroup]= "loginForm" (ngSubmit)= "doLogin()">
  <h4>Login:</h4>
  <label for= "userId" placeholder= "enter user name">Username:</label>
  <input id= "userId" type= "text" formControlName= "userId">

  <br>
  <br>

  <label for= "password" aria-placeholder= "enter password">Password:</label>
  <input id= "password" type= "password" formControlName= "password">

  <br>
  <br>

  <button type= "submit" id= "login-button">Login</button>
</form>
