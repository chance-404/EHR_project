<app-header></app-header>


<!-- Need to add user feedback messages / error handling -->
<h4 class= "heading">Register a patient</h4>
<form id= "registerPatientForm" [formGroup]= "registerPatientForm">
  
  <label for= "first-name">First Name:</label>
  <input id= "firs-name" type= "text" formControlName= "firstName">

  <label for= "middle-name">Middle Name:</label>
  <input id= "middle-name" type= "text" formControlName= "middleName">

  <label for= "last-name">Last Name:</label>
  <input id= "last-name" type= "text" formControlName= "lastName">

  <label for= "sex">Sex:</label>
  <select id= "sex" type= "text" formControlName= "sex">
    <option value= "female">Female</option>
    <option value= "male">Male</option>
  </select>

  <label for= "date-of-birth">Date of Birth:</label>
  <input id= "date-of-birth" type= "date" formControlName= "dateOfBirth">

  <button class="registration-button" id="registration-button" (click)="registerPatient()">Register patient</button>
</form>
