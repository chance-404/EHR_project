<app-header></app-header>

<!-- Need to add user feedback messages / error handling -->

<form id= "loginForm" [formGroup]= "loginForm" (ngSubmit)= "checkLogin()">
  <h4>Login:</h4>

  <!-- Error message -->
  <div *ngIf="errorMessage" class="error-message" style="color: red; margin-bottom: 10px;">
    {{ errorMessage }}
  </div>

  <div class="form-group">
    <label for= "userId" placeholder= "enter user name">Username:</label>
    <input id= "userId" type= "login" formControlName= "userId"
    [class.error]="loginForm.get('userId')?.invalid && loginForm.get('userId')?.touched">

    <div *ngIf="loginForm.get('userId')?.invalid && loginForm.get('userId')?.touched" class="field-error">
      <small *ngIf="loginForm.get('userId')?.errors?.['minlength']">User ID must be at least 7 characters</small>
    </div>
  </div>

  <br>
  <br>

  <div class="form-group">
    <label for= "password" placeholder= "enter password">Password:</label>
    <input id= "password" type= "password" formControlName= "password"
    [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">

    <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="field-error">
      <small *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 8 characters</small>
    </div>
  </div>

  <br>
  <br>

  <button type= "submit" id= "login-button"
    [disabled]="loginForm.invalid || isLoading">
    <span *ngIf="isLoading">Logging in...</span>
    <span *ngIf="!isLoading">Login</span>
  </button>
</form>
